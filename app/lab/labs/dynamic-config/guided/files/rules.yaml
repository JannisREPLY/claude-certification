security_group:
  name: orders-web
  description: Orders web tier

rules:
  - name: https
    port: 443
    protocol: tcp
    cidr: 0.0.0.0/0
  - name: app
    port: 8443
    protocol: tcp
    cidr: 0.0.0.0/0
  - name: ssh
    port: 22
    protocol: tcp
    cidr: 10.0.0.0/8
  - name: syslog
    port: 514
    protocol: udp
    cidr: 0.0.0.0/0
