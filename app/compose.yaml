services:
  cert-trainer:
    build: .
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped

  lab:
    build: lab
    restart: unless-stopped

  moto:
    image: motoserver/moto:5.2.5
    restart: unless-stopped
    environment:
      MOTO_S3_CUSTOM_ENDPOINTS: http://moto:5000
    networks:
      default:
        aliases:
          - tfstate-lab.moto
