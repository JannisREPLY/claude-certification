services:
  cert-trainer:
    build: .
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped

  lab:
    build: lab
    restart: unless-stopped

  moto:
    image: motoserver/moto:5.2.5
    restart: unless-stopped
    environment:
      MOTO_S3_CUSTOM_ENDPOINTS: http://moto:5000
    networks:
      default:
        aliases:
          - tfstate-lab.moto
          - orders-artifacts.moto
          - orders-reports.moto
          - platform-artifacts.moto
          - nw-bf-tfstate.moto
          - nw-bf-manifests.moto
          - nw-bf-legacy-exports.moto
          - nw-dr-primary-data.moto
          - nw-dr-backup-123456789012.moto
          - nw-sto-manifests.moto
          - nw-sto-invoices.moto
          - nw-sto-archive.moto
          - vt-orders-config.moto
          - vt-orders-config-test.moto
          - storefront-artifacts.moto
          - payments-tfstate.moto
          - payments-releases.moto
          - acme-reports-east.moto
          - acme-reports-west.moto
